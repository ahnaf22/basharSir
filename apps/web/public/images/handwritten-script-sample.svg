<svg width="600" height="420" viewBox="0 0 600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Paper shadow -->
    <filter id="paperShadow" x="0" y="0" width="600" height="420" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0F2942" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F2942" flood-opacity="0.04"/>
    </filter>
    <!-- Stamp rotate -->
    <linearGradient id="stampGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <!-- Notebook Page Background -->
  <rect x="20" y="16" width="560" height="388" rx="8" fill="#FFFDF8" filter="url(#paperShadow)"/>
  <rect x="20" y="16" width="560" height="388" rx="8" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Left Red Margin Line -->
  <line x1="100" y1="16" x2="100" y2="404" stroke="#F87171" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Top Header Margin Line -->
  <line x1="20" y1="72" x2="580" y2="72" stroke="#F87171" stroke-width="1.5" stroke-opacity="0.7"/>

  <!-- Ruled Blue Lines -->
  <line x1="20" y1="110" x2="580" y2="110" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="20" y1="148" x2="580" y2="148" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="20" y1="186" x2="580" y2="186" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="20" y1="224" x2="580" y2="224" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="20" y1="262" x2="580" y2="262" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="20" y1="300" x2="580" y2="300" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="20" y1="338" x2="580" y2="338" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="20" y1="376" x2="580" y2="376" stroke="#93C5FD" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Header Info (Handwritten pencil look) -->
  <text x="110" y="52" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="13" font-weight="600" fill="#475569">
    বিষয়: গণিত (বীজগণিতীয় রাশি) · শ্রেণি: ৮ম
  </text>
  <text x="470" y="52" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="12" font-weight="500" fill="#64748B">
    তারিখ: ০২/১১/২০২৬
  </text>

  <!-- Question Number in Margin -->
  <text x="50" y="104" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">
    প্র. ১
  </text>

  <!-- Question Text -->
  <text x="112" y="104" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="14" font-weight="500" fill="#1E293B">
    সূত্রের সাহায্যে (৩x + ৪y)² এর বিস্তৃতি নির্ণয় করো।
  </text>

  <!-- Solution Line 1 -->
  <text x="112" y="142" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="14" font-weight="600" fill="#1E40AF">
    সমাধান: আমরা জানি, (a + b)² = a² + 2ab + b²
  </text>
  <!-- Red pen tick mark -->
  <path d="M490 135 L496 142 L512 126" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Solution Line 2 -->
  <text x="112" y="180" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="14" font-weight="500" fill="#1E293B">
    এখানে প্রথম পদ a = ৩x এবং দ্বিতীয় পদ b = ৪y
  </text>
  <!-- Red pen tick mark -->
  <path d="M490 173 L496 180 L512 164" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Solution Line 3 -->
  <text x="112" y="218" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="14" font-weight="600" fill="#1E293B">
    ∴ (৩x + ৪y)² = (৩x)² + ২(৩x)(৪y) + (৪y)²
  </text>
  <!-- Red pen tick mark -->
  <path d="M490 211 L496 218 L512 202" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Solution Line 4 (Result) -->
  <text x="112" y="256" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="15" font-weight="700" fill="#0F172A">
    = ৯x² + ২৪xy + ১৬y²   (উত্তর)
  </text>
  <!-- Red pen big double tick mark -->
  <path d="M485 249 L493 257 L514 236" stroke="#DC2626" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Teacher's Handwritten Red Pen Comment -->
  <g transform="translate(112, 280)">
    <rect x="-8" y="0" width="360" height="72" rx="8" fill="#FEF2F2" fill-opacity="0.7" stroke="#FECACA" stroke-dasharray="4 4"/>
    <text x="6" y="22" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="12" font-weight="700" fill="#DC2626">
      শিক্ষকের মন্তব্য (বাশার স্যার):
    </text>
    <text x="6" y="42" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="12" font-weight="500" fill="#991B1B">
      সাবাশ! ৩য় লাইনে সংখ্যা ও চলকের আলাদা বর্গ এবং মধ্যপদ ২৪xy
    </text>
    <text x="6" y="60" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="12" font-weight="500" fill="#991B1B">
      হিসাব একদম নির্ভুল হয়েছে। পূর্ণ নম্বর দেওয়া হলো।
    </text>
  </g>

  <!-- Official Teacher Stamp (Tilted Seal) -->
  <g transform="translate(430, 270) rotate(-8)">
    <rect x="0" y="0" width="128" height="74" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 3"/>
    <text x="64" y="22" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="11" font-weight="700" fill="#991B1B">
      বাশার স্যার · এআই মূল্যায়ন
    </text>
    <text x="64" y="44" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="16" font-weight="800" fill="#DC2626">
      ১০ / ১০ (পূর্ণ নম্বর)
    </text>
    <text x="64" y="62" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Sans Bengali', sans-serif" font-size="10" font-weight="600" fill="#991B1B">
      NCTB রুব্রিক অনুযায়ী যাচাইকৃত
    </text>
  </g>
</svg>

